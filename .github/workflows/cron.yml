name: cron

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main
      - name: Update version and lockfiles
        id: update
        run: |
          previous_version=$(jq -r .rev VERSION.json)
          nix run .#update --accept-flake-config
          version=$(jq -r .rev VERSION.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" != "$previous_version" ]]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run security scans
        run: nix run .#scan --accept-flake-config
      - name: Build packages
        run: |
          if git diff --quiet -- VERSION.json package-lock.json bun.lock bun.nix; then
            exit 0
          fi
          nix build path:.#prime-agent --no-link --accept-flake-config
          nix build path:.#prime-agent-bun --no-link --accept-flake-config
      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.update.outputs.version }}
          VERSION_CHANGED: ${{ steps.update.outputs.version_changed }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code VERSION.json package-lock.json bun.lock bun.nix; then
            echo "No changes to commit"
            exit 0
          fi

          push_tag=false
          git add VERSION.json package-lock.json bun.lock bun.nix
          if [[ "$VERSION_CHANGED" == "true" ]]; then
            git commit -m "Update Prime Agent to ${VERSION}"
            if ! git ls-remote --tags --refs origin "refs/tags/${VERSION}" | grep -q .; then
              git tag -a "$VERSION" -m "$VERSION"
              push_tag=true
            fi
          else
            git commit -m "Update lockfiles"
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Updater left uncommitted changes"
            git status --short
            exit 1
          fi

          git push origin "HEAD:${BRANCH}"
          if [[ "$push_tag" == "true" ]]; then
            git push origin "refs/tags/${VERSION}"
          fi
